rules = [
  # Folders
  { name = "*/", text = "󰉋", fg = "#89b4fa" },
  # Hidden
  { name = ".*", text = "󰘓", fg = "#6c7086" },
  # Git
  { name = ".git*", text = "󰊢", fg = "#f38ba8" },
  { name = ".gitignore", text = "󰊢", fg = "#f38ba8" },
  # Config
  { name = "*.toml", text = "󰰱", fg = "#fab387" },
  { name = "*.yaml", text = "󰰱", fg = "#fab387" },
  { name = "*.yml", text = "󰰱", fg = "#fab387" },
  { name = "*.json", text = "󰘦", fg = "#f9e2af" },
