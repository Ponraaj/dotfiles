  # Lock files
  { name = "package-lock.json", text = "󰌷", fg = "#6c7086" },
  { name = "yarn.lock", text = "󰌷", fg = "#6c7086" },
  { name = "Cargo.lock", text = "󰌷", fg = "#6c7086" },
