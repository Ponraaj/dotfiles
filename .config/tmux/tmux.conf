# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Tmux Configuration - Keyboard-Centric Terminal
# Prefix: Ctrl+a (easier than Ctrl+b)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Terminal & Colors ───────────────────────────────────────
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -as terminal-features xterm-256color:clipboard
set-option -s set-clipboard on

# ── Prefix (Change to Ctrl+a for easier access) ─────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Mouse (Disabled for pure keyboard workflow) ─────────────
set -g mouse on

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Source the config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g focus-events on
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# set-window-option -g synchronize-panes on
set -g detach-on-destroy off

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy 'tmux'
set -g @catppuccin_flavour 'mocha'
set -g @continuum-restore 'on'
set -g @catppuccin_window_status_style "rounded"
set -g status-right 'Session: #S '
set -g status-left '  '
set -g status-right-length 100
set -g status-left-length 100

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

set -g @vim_navigator_prefix_mapping_clear_screen ""

set -g status-position top

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
# ── Copy Mode (Vim-Style) ───────────────────────────────────
# Enter copy mode: Prefix + [ or Prefix + Space
# Visual mode: v
# Rectangle select: Ctrl+v
# Yank: y (copies to clipboard)
# Yank line: Y
# Cancel: q or Escape
# Paste: Prefix + ]

# Quick copy mode entry
bind [ copy-mode
bind Space copy-mode
bind ] paste-buffer

# Vim copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi Y send-keys -X copy-end-of-line
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -as terminal-features xterm-256color:clipboard
set-option -s set-clipboard on

bind-key "O" display-popup -E -w 40% -h 60% -d '#{pane_current_path}' -T 'Sesh' "sesh connect \"$(
 sesh list -i | gum filter --limit 1 --no-sort --no-strip-ansi --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""

# ── Sesh + Session Management ────────────────────────────────
bind -N "Sesh picker (gum)" s display-popup -E -w 50% -h 60% -d '#{pane_current_path}' -T 'Sesh' "sesh connect \"$(
 sesh list -i | gum filter --limit 1 --no-sort --no-strip-ansi --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""
bind -N "Sesh picker (tmux only)" S display-popup -E -w 50% -h 60% -d '#{pane_current_path}' -T 'Sesh (tmux)' "sesh connect \"$(
 sesh list -t -i | gum filter --limit 1 --no-sort --no-strip-ansi --fuzzy --placeholder 'Pick a tmux sesh' --height 50 --prompt='🪟'
)\""
bind -N "Sesh last" L run-shell "sesh last"
bind -N "Sesh root" 9 run-shell "sesh connect --root \"#{pane_current_path}\""
bind -N "Rename session" , command-prompt -I "#S" "rename-session '%%'"
bind -N "New session" C command-prompt -p "New session name:" "new-session -A -s '%%'"
bind -N "Kill session" X confirm-before -p "Kill session #S? (y/n)" "kill-session"
bind -N "Switch session" T choose-tree -Zs
bind -N "Session manager menu" m display-menu -T "Session Manager" \
  "Sesh (gum)" s "run-shell \"sesh connect \\\"$(sesh list -i | gum filter --limit 1 --no-sort --no-strip-ansi --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡')\\\"\"" \
  "Sesh (tmux)" t "run-shell \"sesh connect \\\"$(sesh list -t -i | gum filter --limit 1 --no-sort --no-strip-ansi --fuzzy --placeholder 'Pick a tmux sesh' --height 50 --prompt='🪟')\\\"\"" \
  "Last session" l "run-shell 'sesh last'" \
  "Root session" r "run-shell \"sesh connect --root \\\"#{pane_current_path}\\\"\"" \
  "New session" n "command-prompt -p 'New session name:' 'new-session -A -s %%'" \
  "Rename session" R "command-prompt -I '#S' 'rename-session %%'" \
  "Kill session" k "confirm-before -p 'Kill session #S? (y/n)' 'kill-session'"

run '~/.config/tmux/plugins/tpm/tpm'
